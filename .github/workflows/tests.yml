name: Unit Tests

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        working-directory: tests
        run: make test

      - name: Report coverage (core modules)
        working-directory: tests
        run: make coverage
